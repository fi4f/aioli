<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>Mercury</title>
  <link rel="icon" href="data:,">
  <link rel="modulepreload" href="./hg/compiler.js">
  <link rel="modulepreload" href="./hg/app.js">
  <link rel="modulepreload" href="./hg/bindings.js">
  <link rel="modulepreload" href="./hg/types.js">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #272822; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #host-loading:not([hidden]) { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; color: #f8f8f2; background: #272822; font: 14px monospace; cursor: progress; }
    #host-loading strong { color: #a6e22e; font-size: 24px; }
    #host-error { position: fixed; z-index: 1; inset: auto 12px 12px; max-height: 45%; overflow: auto; padding: 12px; color: #fff; background: #30212b; border: 1px solid #ff8da1; font: 14px system-ui; }
    #host-error pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
  <canvas id="canvas" width="1100" height="800" aria-label="Mercury canvas editor" aria-busy="true"></canvas>
  <section id="host-loading" role="status" aria-live="polite">
    <strong>Mercury</strong>
    <p id="host-loading-status">Loading editor…</p>
  </section>
  <section id="host-error" role="alert" hidden>
    <strong>Editor error</strong>
    <p>Press F2 or open recovery to repair the editor.</p>
    <button id="host-recover" type="button">Open recovery</button>
    <pre id="host-diagnostic"></pre>
  </section>
  <script type="module" src="./index.js"></script>
</html>
